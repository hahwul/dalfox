[package]
name = "dalfox"
version = "3.2.2"
edition = "2024"
rust-version = "1.93"
authors = ["hahwul"]
description = "Dalfox is a powerful open-source XSS scanner and utility focused on automation"
license = "MIT"
homepage = "https://github.com/hahwul/dalfox"
repository = "https://github.com/hahwul/dalfox"

[dependencies]
clap = { version = "4.0", features = ["derive", "env"] }
url = "2.0"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "socks", "multipart", "json", "form", "gzip", "deflate", "brotli"
] }
# Pin rustls to the `ring` crypto backend instead of the default `aws-lc-rs`.
# aws-lc-sys ships C/asm that fails to link on several distros (AUR, musl,
# etc. — see #1061), whereas ring's prebuilt assembly is portable. reqwest's
# `rustls-no-provider` feature leaves the crypto provider unset, so we install
# ring's as the process default (see `dalfox::ensure_crypto_provider`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# `default-features = false` drops scraper's `errors` and `main` features.
#
# `errors` makes every `Html` retain a `Vec<Cow<str>>` holding ONE heap-allocated
# message per tokenizer parse error, for the lifetime of the document. That vec is
# proportional to the number of MALFORMED characters, not to body size, so a
# response body of `<` or NUL bytes yields one allocation per byte: a 16 MiB body
# (our `read_body_capped` ceiling) produced ~16.7M allocations and ~1-2 GB of RSS
# from a 521 KB gzipped response. The byte cap bounds what we read; this bounds
# what parsing that many bytes can cost. Nothing in dalfox ever reads
# `Html::errors` — we only ever walk the tree — so dropping it is free.
#
# `main` only exists to build scraper's own CLI binary (it pulls `getopts`).
scraper = { version = "0.27", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.18"
console = "0.16"
urlencoding = "2.1"
base64 = "0.23"
chrono = "0.4"
toml = "1"
axum = "0.8"
sha2 = "0.11"
hex = "0.4"
regex = "1"
rmcp = { version = "3.0.1", features = ["server", "macros"] }
schemars = { version = "1", features = ["derive"] }
oxc_parser = "0.133.0"
oxc_ast = "0.133.0"
oxc_allocator = "0.133.0"
oxc_span = "0.133.0"

# OOB / OAST (interactsh) blind-XSS support. interactsh needs RSA-OAEP(SHA-256)
# to unwrap the per-poll AES key and AES-256-CTR to decrypt each interaction.
# `rsa` 0.9 is built against the digest/sha2 0.10 line, so the OAEP digest comes
# from an aliased `sha2 0.10` (`sha2_oaep`) — the existing `sha2 0.11` above is
# left untouched for response fingerprinting.
# `rand` is kept at 0.8 (rsa 0.9 binds rand_core 0.6); aes/ctr can be newer
# (we use the modern cipher 0.5+ KeyIvInit API for AES-256-CTR).
rsa = { version = "0.9", features = ["pem"] }
aes = "0.9"
ctr = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
sha2_oaep = { package = "sha2", version = "0.10" }
clap_mangen = "0.3"
clap_complete = "4"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[package.metadata.deb]
maintainer = "hahwul <hahwul@gmail.com>"
copyright = "2024, hahwul"
license-file = "LICENSE.txt"
extended-description = """Dalfox is a powerful open-source XSS scanner and automation utility.
It supports reflected, stored, and DOM-based XSS discovery with AST-backed verification."""
depends = ["ca-certificates"]
section = "utils"
priority = "optional"
# `target/man/dalfox.1` and `target/completions/*` are rendered by the release
# workflow (`dalfox man` / `dalfox completion <shell>`) right before packaging —
# they are generated, never committed. Keep them out of the `target/release/`
# prefix, which cargo-deb rewrites to the real target dir when cross-building.
assets = [
    { source = "target/release/dalfox", dest = "/usr/bin/dalfox", mode = "755" },
    { source = "target/man/dalfox.1", dest = "/usr/share/man/man1/dalfox.1", mode = "644" },
    { source = "target/completions/dalfox.bash", dest = "/usr/share/bash-completion/completions/dalfox", mode = "644" },
    { source = "target/completions/dalfox.zsh", dest = "/usr/share/zsh/site-functions/_dalfox", mode = "644" },
    { source = "target/completions/dalfox.fish", dest = "/usr/share/fish/vendor_completions.d/dalfox.fish", mode = "644" },
]

[package.metadata.generate-rpm]
license = "MIT"
summary = "Powerful open-source XSS scanner"
group = "Applications/System"
homepage = "https://github.com/hahwul/dalfox"
description = """Dalfox is a powerful open-source XSS scanner and automation utility.
It supports reflected, stored, and DOM-based XSS discovery with AST-backed verification."""
# See the note above the `[package.metadata.deb]` assets: cargo-generate-rpm
# rewrites `target/release/` too when `--target` is passed, so the generated
# man page and completions live outside that prefix.
assets = [
    { source = "target/release/dalfox", dest = "/usr/bin/dalfox", mode = "755" },
    { source = "target/man/dalfox.1", dest = "/usr/share/man/man1/dalfox.1", mode = "644" },
    { source = "target/completions/dalfox.bash", dest = "/usr/share/bash-completion/completions/dalfox", mode = "644" },
    { source = "target/completions/dalfox.zsh", dest = "/usr/share/zsh/site-functions/_dalfox", mode = "644" },
    { source = "target/completions/dalfox.fish", dest = "/usr/share/fish/vendor_completions.d/dalfox.fish", mode = "644" },
]

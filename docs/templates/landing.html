{% include "header.html" %}
  <main class="landing" id="main">
    {{ content }}
  </main>
  <div class="search-overlay" id="searchOverlay">
    <div class="search-modal">
      <div class="search-input-wrap">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="{% if page_language == "ko" %}문서 검색...{% else %}Search documentation...{% endif %}" aria-label="{% if page_language == "ko" %}문서 검색{% else %}Search documentation{% endif %}" autocomplete="off">
        <kbd>ESC</kbd>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>
  <footer class="site-footer">
    <div class="footer-mark">
      <a href="https://www.hahwul.com" target="_blank" rel="noopener">
        <span class="hahwul-img" role="img" aria-label="hahwul"></span>
      </a>
      <p class="footer-love">Built with Love</p>
    </div>
  </footer>
  <script src="{{ base_url }}/assets/js/highlight.min.js"></script>
  <script src="{{ base_url }}/js/search.js"></script>
  <script src="{{ base_url }}/js/ui.js"></script>
  <script src="{{ base_url }}/js/landing.js"></script>
  {{ auto_includes_js }}
</body>
</html>

---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ["**/*.rs", Cargo.toml, Cargo.lock, "src/**/*.toml", "src/**/*.txt", packaging/docker/Dockerfile, .github/workflows/ci.yml]
  workflow_dispatch:
# A new push to a PR cancels the run of the previous one. Every other run
# (push to main, schedule, manual) gets a group of its own and always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The default is the 6-hour job limit. A test that wedges (the windows leg
    # has done exactly that) then burns six runner-hours before anyone sees a
    # red check; the whole matrix normally finishes in under six minutes.
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v7
      # Restores compiled dependencies. Only runs on main write the cache, so a
      # PR reads main's entry and cannot fill the cache quota (10 GB by default)
      # with its own.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install latest stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
  coverage:
    # Dependabot PRs run without repository secrets, so CODECOV_TOKEN is empty
    # and the upload below fails (fail_ci_if_error). A dependency-only diff has
    # no patch coverage to report, and the push to main after the merge still
    # uploads.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.90.6
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./lcov.info
          verbose: true
          fail_ci_if_error: true

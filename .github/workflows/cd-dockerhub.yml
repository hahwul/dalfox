---
name: Dockerhub Publish
on:
  push:
    tags: [v*.*.*]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag version (e.g. v1.2.3)"
        required: true
        default: "manual"
jobs:
  dockerhub-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate manual image tag
        id: manual-tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          LC_ALL: C
        run: |
          if [[ ! "$MANUAL_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo '::error::Enter a valid Docker image tag (1–128 characters).'
            exit 1
          fi
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: hahwul/dalfox
          # An explicit prefix survives the action's prerelease fallback.
          # The alias rules retain the existing unprefixed prerelease tag.
          tags: |
            type=semver,pattern=v{{major}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}},prefix=v,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./packaging/docker/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

---
name: AUR Publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 3.0.0)"
        required: true
        type: string
      pkgrel:
        description: "Package release (bump for packaging-only fixes; 1 for a new version)"
        required: false
        default: "1"
        type: string
  workflow_run:
    workflows: ["Release"]
    types: [completed]
jobs:
  publish-aur:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          # On manual dispatch, read the (possibly hotfixed) PKGBUILD from the
          # branch the workflow runs on (e.g. main) rather than the release tag,
          # so packaging-only fixes can ship to AUR without cutting a release.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}

      - name: Update PKGBUILD version
        env:
          RAW_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.workflow_run.head_branch }}
          PACKAGE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.pkgrel || '1' }}
        shell: bash
        run: |
          upstream_version="${RAW_VERSION#v}"
          if [[ ! $upstream_version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf 'Invalid upstream version %q\n' "$RAW_VERSION" >&2
            exit 1
          fi
          if [[ ! $PACKAGE_RELEASE =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
            printf 'Invalid package release %q\n' "$PACKAGE_RELEASE" >&2
            exit 1
          fi
          sed -i -e "s/^_upstreamver=.*/_upstreamver=$upstream_version/" \
            -e "s/^pkgrel=.*/pkgrel=$PACKAGE_RELEASE/" packaging/aur/PKGBUILD
          cat packaging/aur/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: dalfox
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: hahwul
          commit_email: hahwul@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

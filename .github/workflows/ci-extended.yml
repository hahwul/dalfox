---
name: Extended CI
on:
  push:
    branches: [main]
    # tests/** carries the mock-case corpus the effectiveness gate scores and
    # the fixtures the ignored functional tests load; skills/** is one of the
    # surfaces the parity gate compares; the snap and AUR recipes carry a
    # version the lockstep check reads. docs/** is deliberately absent: a
    # docs-only change should not run the Rust jobs here, so the docs lint
    # also runs on its own in ci-docs.yml.
    paths: [Cargo.toml, Cargo.lock, "**/*.rs", "src/**/*.toml", "src/**/*.txt", "tests/**", "skills/**", "scripts/**", "docs/data/**", snap/snapcraft.yaml, packaging/aur/PKGBUILD,
            .github/workflows/ci-extended.yml, .github/workflows/cd-dockerhub.yml, .github/workflows/cd-snapcraft.yml, .github/workflows/cd-release.yml, .github/workflows/cd-release-asset.yml]
  pull_request:
    branches: [main]
    # tests/** carries the mock-case corpus the effectiveness gate scores and
    # the fixtures the ignored functional tests load; skills/** is one of the
    # surfaces the parity gate compares; the snap and AUR recipes carry a
    # version the lockstep check reads. docs/** is deliberately absent: a
    # docs-only change should not run the Rust jobs here, so the docs lint
    # also runs on its own in ci-docs.yml.
    paths: [Cargo.toml, Cargo.lock, "**/*.rs", "src/**/*.toml", "src/**/*.txt", "tests/**", "skills/**", "scripts/**", "docs/data/**", snap/snapcraft.yaml, packaging/aur/PKGBUILD,
            .github/workflows/ci-extended.yml, .github/workflows/cd-dockerhub.yml, .github/workflows/cd-snapcraft.yml, .github/workflows/cd-release.yml, .github/workflows/cd-release-asset.yml]
  schedule:
    # Weekly: exercise the slower, normally-#[ignore]d functional suite so it
    # can't silently rot between releases.
    - cron: "0 5 * * 1"
  workflow_dispatch:
# A new push to a PR cancels the run of the previous one. Every other run
# (push to main, schedule, manual) gets a group of its own and always finishes.
concurrency:
  group: ci-extended-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          rv=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*=//; s/[" ]//g')
          echo "version=$rv" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $rv"
      - name: Install pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Build at MSRV (locked deps)
        run: cargo +${{ steps.msrv.outputs.version }} build --locked --all-targets
  msrv-windows:
    name: MSRV on Windows (tests)
    runs-on: windows-latest
    # The `msrv` job above only *builds*, and only on Linux, so it cannot see a
    # defect that needs an older toolchain and Windows at the same time. One
    # did: a tokio runtime cached in a `thread_local!` deadlocked thread exit
    # inside the Windows loader lock, wedging `cargo test` on Rust 1.97.1 while
    # 1.98.0 ran clean. ci.yml's windows leg uses whatever Rust the runner
    # image happens to ship, so it went green the moment the image fleet
    # rolled forward -- with the defect still in the tree. Pinning the declared
    # MSRV here keeps that combination covered no matter what the image ships.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read MSRV from Cargo.toml
        id: msrv
        shell: bash
        run: |
          rv=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*=//; s/[" ]//g')
          echo "version=$rv" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $rv"
      - name: Install pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      # Restores compiled dependencies. Only runs on main write the cache, so a
      # PR reads main's entry and cannot fill the cache quota (10 GB by default)
      # with its own.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests at MSRV (locked deps)
        run: cargo +${{ steps.msrv.outputs.version }} test --locked
  ignored-tests:
    name: Ignored / functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run normally-ignored tests
        # On a PR or a push, --ignored runs only the normally-skipped
        # functional suite: ci.yml runs the regular tests on three platforms
        # for every change to Rust sources or the manifest, and the other
        # paths that trigger this workflow (scripts/, docs/data/, release
        # workflows) are not read by any Rust test. The weekly and manual
        # runs have no ci.yml run beside them, so they keep
        # --include-ignored and run everything. The
        # four detection-coverage *benchmark* tests are excluded by name:
        # they assert detection-rate targets the scanner does not yet meet
        # (see their `#[ignore = "benchmark: ..."]` reasons) and are tracked
        # separately, so they must not gate CI. The --skip patterns are
        # substrings chosen to match only those four:
        #   realworld            -> test_realworld_xss_scenarios, _by_category
        #   category_baselines   -> test_query_reflection_category_baselines_v2
        #   test_query_reflection_v2 -> that exact test (not the _diverse/_advanced variants)
        # No --all-targets: it would try to run the bench-shaped probe files
        # as benchmarks, which fails.
        env:
          SELECTION: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--include-ignored' || '--ignored' }}
        run: |
          cargo test -- "$SELECTION" \
            --skip realworld \
            --skip category_baselines \
            --skip test_query_reflection_v2
  harness-binary:
    name: Release binary for the harnesses
    runs-on: ubuntu-latest
    # Both harness jobs drive the same release binary. Building it here once
    # and handing it over saves a second ~4 minute LTO build per run.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: dalfox-release
          path: target/release/dalfox
          if-no-files-found: error
          retention-days: 1
  harness-gates:
    name: Crystal harnesses (gates)
    needs: harness-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # install-crystal apt-installs its build deps without refreshing the
      # index; a stale runner image then 404s on superseded .debs.
      - run: sudo apt-get update -q
      - uses: crystal-lang/install-crystal@v1
      # Reads files only (no binary needed), so it runs first and fails fast:
      # every version-bearing file must agree, catching a partial bump before
      # a release rather than after publishing.
      - name: Version lockstep (Cargo / snap / AUR / docs incl. KO)
        run: crystal run scripts/version_check.cr
      - name: Release tooling regressions
        run: crystal spec scripts/spec/version_update_spec.cr scripts/spec/dockerhub_release_spec.cr
      - name: SBOM release regression
        run: crystal spec scripts/spec/sbom_release_spec.cr
      # The harnesses look for target/release/dalfox. Artifacts do not keep
      # the executable bit. Running it once makes a binary this runner image
      # cannot execute fail here instead of inside a harness.
      - uses: actions/download-artifact@v8
        with:
          name: dalfox-release
          path: target/release
      - run: chmod +x target/release/dalfox && target/release/dalfox --version
      # All green, so all blocking. `effectiveness` fails when recall drops or
      # the FP count rises against docs/data/effectiveness.json; `perf-budget`
      # fails when a scenario's request volume or wall-clock exceeds
      # docs/data/perf-budget.json by more than its tolerance, or when findings
      # drop (a cost win that costs detection is not a win); `hostile-scan`
      # fails on a crash, a hang, or peak RSS over 1 GB.
      - name: Effectiveness accounting self-test
        run: EFFECTIVENESS_SELF_TEST=1 crystal run scripts/effectiveness_snapshot.cr
      - name: Effectiveness (precision / recall gate)
        run: crystal run scripts/effectiveness_snapshot.cr
      - name: Perf budget (request-volume gate)
        run: crystal run scripts/perf_budget.cr
      - name: Surface parity (CLI / config / REST / MCP / skills / docs)
        run: crystal run scripts/surface_parity.cr
      - name: Output conformance (formats + stdout purity)
        run: crystal run scripts/output_conformance.cr
      - name: Docs lint (EN/KO pairing, links, CSP, markers)
        run: |
          crystal spec scripts/spec/docs_lint_spec.cr
          crystal run scripts/docs_lint.cr
      - name: Snapcraft release channel regression
        run: crystal spec scripts/spec/snapcraft_release_spec.cr
      - name: Replay corpus (benign pages must yield no findings)
        run: crystal run scripts/replay_corpus.cr
      - name: Hostile responses (crash / hang / memory)
        run: crystal run scripts/hostile_scan.cr
      - name: Debian package asset regression
        run: crystal spec scripts/spec/debian_release_spec.cr
  harness-smoke:
    name: Crystal harnesses (server + MCP)
    needs: harness-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # install-crystal apt-installs its build deps without refreshing the
      # index; a stale runner image then 404s on superseded .debs.
      - run: sudo apt-get update -q
      - uses: crystal-lang/install-crystal@v1
      # The harnesses look for target/release/dalfox. Artifacts do not keep
      # the executable bit. Running it once makes a binary this runner image
      # cannot execute fail here instead of inside a harness.
      - uses: actions/download-artifact@v8
        with:
          name: dalfox-release
          path: target/release
      - run: chmod +x target/release/dalfox && target/release/dalfox --version
      - name: Server + MCP smoke
        run: crystal run scripts/server_mcp_smoke.cr

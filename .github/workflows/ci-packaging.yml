---
name: Packaging Build
# Source-build gates for the distro packaging paths that the default CI
# (glibc + GNU ld on ubuntu/macos/windows) never exercises. These would have
# caught #1061, where aws-lc-sys failed to link under Arch's rust toolchain
# (lld). Each job builds dalfox from source the way a downstream packager
# does, then smoke-runs the binary.
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/*.rs"
      - aur/PKGBUILD
      - snap/snapcraft.yaml
      - flake.nix
      - flake.lock
      - .github/workflows/ci-packaging.yml
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/*.rs"
      - aur/PKGBUILD
      - snap/snapcraft.yaml
      - flake.nix
      - flake.lock
      - .github/workflows/ci-packaging.yml
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  arch-aur:
    name: AUR source build (Arch, lld)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    # Reproduces the reporter's environment from #1061: Arch's rust package
    # linking with lld. We run the same cargo invocation the AUR PKGBUILD
    # uses, against this PR's working tree. We deliberately do NOT call
    # makepkg: its source=() points at the published v<pkgver> release
    # tarball, so it would build the released source instead of this PR.
    env:
      # Force the lld link path the AUR failure surfaced under, so any
      # regression of the aws-lc-sys class fails here too.
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm --needed base-devel rust git lld
      - uses: actions/checkout@v7
      - name: Build like the AUR PKGBUILD
        run: |
          cargo fetch --locked
          cargo build --frozen --release --all-features
      - name: Smoke test the binary
        run: ./target/release/dalfox --version

  musl:
    name: Static musl build
    runs-on: ubuntu-latest
    # musl is where C-FFI crates (the aws-lc-sys class) most often break, so a
    # static build is a cheap canary that the dependency graph stays
    # pure-Rust / musl-friendly.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (static musl)
        run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - name: Smoke test the binary
        run: ./target/x86_64-unknown-linux-musl/release/dalfox --version

  snap:
    name: Snap source build
    runs-on: ubuntu-latest
    # Builds snap/snapcraft.yaml the way the Snap Store does (snapcraft + LXD),
    # validating the amd64 source build before publish. The arm64/armhf/i386
    # entries in snapcraft.yaml build only on a matching host, so they are
    # covered separately via `snapcraft remote-build` at release time.
    steps:
      - uses: actions/checkout@v7
      - name: Build snap
        uses: snapcore/action-build@v1

  nix:
    name: Nix flake build
    runs-on: ubuntu-latest
    # The flake is the only packaging path nothing else exercises: it pins its
    # own toolchain via rust-overlay, so it can silently fall behind
    # `rust-version` in Cargo.toml and stay broken until a user reports it
    # (which is exactly what happened between #1158 and now). Evaluating and
    # building it here turns that into a red check.
    #
    # Like the sibling jobs, this is an uncached full source build, hence the
    # timeout. The first two steps are the same gates as `just nix-check` /
    # `just nix-build` — keep the three in sync when you change one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check every flake output evaluates
        run: nix flake check --no-build --all-systems
      - name: Check the overlay instantiates
        # `nix flake check` only verifies that overlays.default is a lambda —
        # it never applies it. The overlay is the documented NixOS install
        # path and it builds against the *consumer's* rustPlatform, so it is a
        # different derivation from packages.default and needs its own check.
        run: |
          nix eval --raw --impure --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs {
                system = builtins.currentSystem;
                overlays = [ flake.overlays.default ];
              };
            in
            pkgs.dalfox.drvPath
          '
      - name: Build the package
        run: nix build .#default --print-build-logs
      - name: Smoke test the binary
        run: ./result/bin/dalfox --version
      - name: Assert the generated artifacts are installed
        # postInstall renders these from the freshly built binary; a silent
        # regression there is exactly the class the .deb guard catches too.
        run: |
          test -f result/share/man/man1/dalfox.1.gz
          test -f result/share/bash-completion/completions/dalfox.bash
          test -f result/share/zsh/site-functions/_dalfox
          test -f result/share/fish/vendor_completions.d/dalfox.fish

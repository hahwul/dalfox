---
name: Release Assets
on:
  release:
    types: [published]
jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    name: Generate and Upload SBOM
    env:
      SBOM_PATH: dalfox.cdx.xml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx
      - name: Generate SBOM
        shell: bash
        run: |
          cargo cyclonedx --format xml --override-filename "${SBOM_PATH%.xml}"
          if [[ ! -f "$SBOM_PATH" || ! -s "$SBOM_PATH" ]]; then
            printf '::error::Generated SBOM %s is missing, empty, or not a file.\n' "$SBOM_PATH"
            exit 1
          fi
      - name: Upload SBOM to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.SBOM_PATH }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.DALFOX_PUBLISH_TOKEN }}
